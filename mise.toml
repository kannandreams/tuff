min_version = "2025.12.12"

[settings]
lockfile = true

[tools]
rust = { version = "1.97.1", components = ["rustfmt", "clippy"] }
node = "24.19.0"
python = "3.14.2"
perl = "5.44.0.0"
pre-commit = "4.6.1"
"github:charmbracelet/freeze" = "0.2.2"

[tasks.deps]
description = "Install project dependencies"
run = [
  "cargo fetch --locked",
  "npm --prefix website ci",
]

[tasks.hooks]
description = "Install repository Git hooks"
run = "pre-commit install"

[tasks.setup]
description = "Prepare the development environment"
run = [
  { task = "deps" },
  { task = "hooks" },
]

[tasks.cli]
description = "Run the Tuff CLI from source"
run = "cargo run -p tuffcli --"

[tasks.test]
description = "Run the Rust test suite"
run = "cargo test"

[tasks.lint]
description = "Run Rust formatting and lint checks"
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets --all-features -- -D warnings",
  { task = "lint-error-kinds" },
]

[tasks.lint-error-kinds]
description = "Hold the line on untyped errors (RFC-105 D6)"
run = """
#!/usr/bin/env bash
set -euo pipefail

# `TuffError::new` builds an Internal error: a bug in Tuff, not a message
# for the user. Every remaining use is one that has not been classified
# yet. The budget only ever goes down; lower it in the same commit that
# converts a module, and delete this task when it reaches zero.
budget=202
count=$(grep -rn 'TuffError::new' crates/*/src --include='*.rs' | grep -vc 'crates/tuff-core/src/error.rs')

if [ "$count" -gt "$budget" ]; then
  echo "untyped TuffError::new sites: $count (budget $budget)" >&2
  echo "Give the new error a kind: TuffError::usage/not_found/refused/drift/source_failed/corrupt/unsupported." >&2
  exit 1
fi
if [ "$count" -lt "$budget" ]; then
  echo "untyped TuffError::new sites: $count, below the budget of $budget." >&2
  echo "Lower 'budget' in mise.toml to $count to lock the progress in." >&2
  exit 1
fi
echo "untyped TuffError::new sites: $count (budget $budget)"
"""

[tasks.build-release]
description = "Build the release CLI binary"
run = "cargo build -p tuffcli --release"

[tasks.capabilities-check]
description = "Validate tracked Tuff capabilities"
run = "cargo run -p tuffcli -- check --json"

[tasks.security-audit]
description = "Reject known npm dependency vulnerabilities"
run = "npm --prefix website audit --audit-level=low"

[tasks.docs-check]
description = "Type-check the documentation site"
run = "npm --prefix website run check"

[tasks.docs-build]
description = "Build the documentation site"
run = "npm --prefix website run build"

[tasks.docs-serve]
description = "Serve the documentation site locally"
depends = ["deps"]
raw = true
run = "npm --prefix website run dev"

[tasks.docs-assets]
description = "Regenerate terminal screenshots"
run = "./scripts/generate-doc-screenshot.sh tuff-welcome.png -- cargo run -p tuffcli --quiet --"

[tasks.docs-deploy]
description = "Deploy the documentation site to Cloudflare Pages"
depends = ["docs-build"]
raw = true
run = '''
#!/usr/bin/env bash
set -euo pipefail

# The Pages project name is not committed: this repository has no Cloudflare
# configuration, and hardcoding the wrong project would publish the docs over
# someone else's site. List yours with:
#   npx --yes wrangler@4 pages project list
project="${CF_PAGES_PROJECT:-}"
if [ -z "$project" ]; then
  echo "Set CF_PAGES_PROJECT to the Cloudflare Pages project name." >&2
  echo "List projects with: npx --yes wrangler@4 pages project list" >&2
  exit 2
fi

# Cloudflare treats the production branch as the live site; any other value
# publishes to a preview URL instead, which is the safe way to check a build.
branch="${CF_PAGES_BRANCH:-main}"

# website/.npmrc sets strict-allow-scripts, so wrangler's postinstall
# packages need naming explicitly. Narrow approval beats
# --dangerously-allow-all-scripts, which would switch the policy off.
npx --yes \
  --allow-scripts=esbuild \
  --allow-scripts=fsevents \
  --allow-scripts=workerd \
  wrangler@4 pages deploy website/dist \
  --project-name="$project" \
  --branch="$branch"
'''

[tasks.smoke-install]
description = "Exercise an installed CLI from a clean directory"
run = '''
#!/usr/bin/env bash
set -euo pipefail

cargo install --locked --path crates/tuff-cli

smoke_dir="${TMPDIR:-/tmp}/tuff-smoke"
rm -rf "$smoke_dir"
mkdir -p "$smoke_dir"

cd "$smoke_dir"
tuff --version
tuff init
tuff add "$MISE_PROJECT_ROOT/examples/skills/python-uv-default"
tuff list
'''

[tasks.check]
description = "Run the full repository check"
run = [
  { task = "deps" },
  { task = "lint" },
  { task = "test" },
  { task = "build-release" },
  { task = "security-audit" },
  { task = "docs-check" },
  { task = "docs-build" },
  { task = "capabilities-check" },
]
