id = "python-script-tool"
version = "0.1.0"
type = "tool"
description = "Analyze a text file with a small Python stdlib script."
files = ["analyze_text.py"]

[parameters]
type = "object"
required = ["path"]

[parameters.properties.path]
type = "string"
description = "Text file path to analyze."

[parameters.properties.preview]
type = "boolean"
description = "Whether to include a short word preview."

[implementation]
language = "python3"
entrypoint = "analyze_text.py"
runtime_deps = ["python>=3.9"]
