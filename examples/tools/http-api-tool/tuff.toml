id = "http-api-tool"
version = "0.1.0"
type = "tool"
description = "Fetch basic status from an HTTP endpoint using Python stdlib networking."
files = ["fetch_status.py"]

[parameters]
type = "object"
required = ["url"]

[parameters.properties.url]
type = "string"
description = "HTTP or HTTPS URL to inspect."

[parameters.properties.method]
type = "string"
description = "HTTP method to use."
enum = ["GET", "HEAD"]

[parameters.properties.timeout_seconds]
type = "number"
description = "Request timeout in seconds."

[implementation]
language = "python3"
entrypoint = "fetch_status.py"
runtime_deps = ["python>=3.9", "network access to the requested URL"]
