[project]
name = "loadout"
version = "0.1.0"
description = "CLI lifecycle manager for repo-local agent primitives."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
loadout = "loadout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]
