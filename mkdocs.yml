site_name: Loadout
site_description: Repo-local lifecycle management for agent primitives.
site_url: https://loadout.dev/
repo_name: loadout
repo_url: https://github.com/your-org/loadout

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy

nav:
  - Introduction: index.md
  - Installation: installation.md
  - Getting Started: getting-started.md
  - CLI Reference: cli.md
  - Primitive Format: primitive-format.md
  - Development: development.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight
  - toc:
      permalink: true
