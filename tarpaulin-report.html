<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>:root {
  --color: black;
  --bg: white;
  --head-bg: white;
  --link: #338;

  --blue: #ccf;
  --red: #fcc;
  --yellow: #ffc;
  --green: #cfc;
}

[data-theme='dark'] {
  --color: white;
  --bg: black;
  --head-bg: #333;
  --link: #aaf;

  --blue: #225;
  --red: #522;
  --yellow: #552;
  --green: #252;
}

html,
body {
  margin: 0;
  padding: 0;
  color: var(--color);
  background: var(--bg);
}

.app {
  margin: 10px;
  padding: 0;
}

.files-list {
  margin: 10px 0 0;
  width: 100%;
  border-collapse: collapse;
}
.files-list__head {
  border: 1px solid #999;
}
.files-list__head > tr > th {
  padding: 10px;
  border: 1px solid #999;
  text-align: left;
  font-weight: normal;
  background: var(--head-bg);
}
.files-list__body {
}
.files-list__file {
  cursor: pointer;
}
.files-list__file:hover {
  background: var(--blue);
}
.files-list__file > td {
  padding: 10px;
  border: 1px solid #999;
}
.files-list__file > td:first-child::before {
  content: '\01F4C4';
  margin-right: 1em;
}
.files-list__file_low {
  background: var(--red);
}
.files-list__file_medium {
  background: var(--yellow);
}
.files-list__file_high {
  background: var(--green);
}
.files-list__file_folder > td:first-child::before {
  content: '\01F4C1';
  margin-right: 1em;
}

.file-header {
  border: 1px solid #999;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: var(--bg);
}

.file-header__back {
  margin: 10px;
  cursor: pointer;
  flex-shrink: 0;
  flex-grow: 0;
  text-decoration: underline;
  color: var(--link);
}

.file-header__name {
  margin: 10px;
  flex-shrink: 2;
  flex-grow: 2;
}

.file-header__stat {
  margin: 10px;
  flex-shrink: 0;
  flex-grow: 0;
}

.file-content {
  margin: 10px 0 0;
  border: 1px solid #999;
  padding: 10px;
  counter-reset: line;
  display: flex;
  flex-direction: column;
}

.code-line::before {
  content: counter(line);
  margin-right: 72px;
}
.code-line {
  margin: 0;
  height: 1em;
  counter-increment: line;

  position: absolute;
  padding: 0 0.3em 0.3em 0.3em;
  display: inherit;
  width: 100%;
}
.code-line_covered {
  background: var(--green);
}
.code-line_uncovered {
  background: var(--red);
}

.code-text-container {
  position: relative;
  height: 1em;
  padding: 0.3em 0;
}

.cover-indicator {
  display: flex;
  width: 100%;
  position: absolute;
  justify-content: end;
  height: 1em;
  align-items: center;
  padding: 0 0.3em 0.3em 0.3em;
}

.cover-indicator.check-cover::after {
  content: "\2713";
  font-weight: bold;
  background-color: var(--green);
  height: 1em;
}

.cover-indicator.no-cover::after {
  content: "\2716";
  font-weight: bold;
  background-color: var(--red);
  height: 1em;
}

.stat-line-hit {
  max-width: 48px;
  overflow: hidden;
  font-weight: bold;
  margin-right: 4px;
  background-color: var(--green);
  position: relative;
  top: 0.1em;
}

#theme-toggle-label {
  margin-left: 1ch;
}
</style>
</head>

ility_type: \u0026str) -\u003e bool {\n    SUPPORTED_TYPES.contains(\u0026capability_type)\n}\n\npub fn plan(capability: \u0026ResolvedCapability, repo_root: \u0026Path) -\u003e Result\u003cVec\u003cPlannedFile\u003e\u003e {\n    match capability.capability_type.as_str() {\n        \"tool\" =\u003e plan_tool(capability, repo_root),\n        \"hook\" =\u003e plan_hook(capability, repo_root),\n        _ =\u003e plan_skill(capability, repo_root),\n    }\n}\n\nfn plan_skill(capability: \u0026ResolvedCapability, repo_root: \u0026Path) -\u003e Result\u003cVec\u003cPlannedFile\u003e\u003e {\n    if capability.source_files.is_empty() {\n        return Err(CoralError::new(\"no source files to emit\"));\n    }\n\n    let mut files = Vec::new();\n    for (rel_path, content) in \u0026capability.source_files {\n        let target_path = repo_root\n            .join(\".agents\")\n            .join(\"skills\")\n            .join(\u0026capability.id)\n            .join(rel_path);\n\n        files.push(PlannedFile {\n            path: lockfile::relative_or_absolute_fs(\u0026target_path, repo_root),\n            content: content.clone(),\n        });\n    }\n    Ok(files)\n}\n\nfn plan_tool(capability: \u0026ResolvedCapability, repo_root: \u0026Path) -\u003e Result\u003cVec\u003cPlannedFile\u003e\u003e {\n    let mut files = Vec::new();\n\n    // Copy source files\n    for (rel_path, content) in \u0026capability.source_files {\n        let target_path = repo_root\n            .join(\".agents\")\n            .join(\"tools\")\n            .join(\u0026capability.id)\n            .join(rel_path);\n\n        files.push(PlannedFile {\n            path: lockfile::relative_or_absolute_fs(\u0026target_path, repo_root),\n            content: content.clone(),\n        });\n    }\n\n    // If no source files, ensure tool dir exists (empty dir will just be created)\n    if capability.source_files.is_empty() {\n        let placeholder = repo_root\n            .join(\".agents\")\n            .join(  =\u003e rd,\n            Err(_) =\u003e return Ok(()),\n        };\n        if rd.next().is_none() {\n            std::fs::remove_dir(kind_dir)?;\n        }\n    }\n\n    let base_dir = kind_dir.parent().expect(\"base dir should have parent\");\n    if base_dir.exists() {\n        let mut rd = match std::fs::read_dir(base_dir) {\n            Ok(rd) =\u003e rd,\n            Err(_) =\u003e return Ok(()),\n        };\n        if rd.next().is_none() {\n            std::fs::remove_dir(base_dir)?;\n        }\n    }\n\n    Ok(())\n}\n\n#[allow(dead_code)]\npub fn detect(repo_root: \u0026Path) -\u003e bool {\n    repo_root.join(\".agents\").join(\"skills\").exists()\n}\n","traces":[{"line":23,"address":[],"length":0,"stats":{"Line":22}},{"line":24,"address":[],"length":0,"stats":{"Line":66}},{"line":27,"address":[],"length":0,"stats":{"Line":22}},{"line":28,"address":[],"length":0,"stats":{"Line":22}},{"line":29,"address":[],"length":0,"stats":{"Line":34}},{"line":30,"address":[],"length":0,"stats":{"Line":24}},{"line":31,"address":[],"length":0,"stats":{"Line":48}},{"line":35,"address":[],"length":0,"stats":{"Line":16}},{"line":36,"address":[],"length":0,"stats":{"Line":32}},{"line":37,"address":[],"length":0,"stats":{"Line":0}},{"line":40,"address":[],"length":0,"stats":{"Line":32}},{"line":41,"address":[],"length":0,"stats":{"Line":64}},{"line":42,"address":[],"length":0,"stats":{"Line":80}},{"line":45,"address":[],"length":0,"stats":{"Line":48}},{"line":46,"address":[],"length":0,"stats":{"Line":32}},{"line":48,"address":[],"length":0,"stats":{"Line":48}},{"line":49,"address":[],"length":0,"stats":{"Line":64}},{"line":50,"address":[],"length":0,"stats":{"Line":16}},{"line":53,"address":[],"length":0,"stats":{"Line":16}},{"line":56,"address":[],"length":0,"stats":{"Line":4}},{"line":57,"address":[],"length":0,"stats":{"Line":8}},{"line":60,"address":[],"length":0,"stats":{"Line":16}},{"line":61,"address":[],"length":0,"stats":{"Line":20}},{"line":64,"address":[],"length  \u0026Path,\n    target_ids: \u0026[String],\n    skill_name: Option\u003c\u0026str\u003e,\n    tool_name: Option\u003c\u0026str\u003e,\n    hook_name: Option\u003c\u0026str\u003e,\n    global: bool,\n) -\u003e Result\u003c()\u003e {\n    let (scope, install_root) = if global {\n        let home = home_dir()?;\n        let lock_path = home.join(\".coral\").join(\"coral-lock.json\");\n        lockfile::init_lockfile_at(\u0026lock_path)?;\n        (Scope::Global, home)\n    } else {\n        (Scope::Project, repo_root.to_path_buf())\n    };\n\n    if git::is_git_url(\u0026capability.to_string_lossy()) {\n        return cmd_add_git(\n            \u0026install_root,\n            scope,\n            \u0026capability.to_string_lossy(),\n            target_ids,\n            skill_name,\n            tool_name,\n            hook_name,\n            repo_root,\n        );\n    }\n    cmd_add_local(\u0026install_root, scope, capability, target_ids, repo_root)\n}\n\nfn cmd_add_git(\n    install_root: \u0026Path,\n    scope: Scope,\n    url: \u0026str,\n    target_ids: \u0026[String],\n    skill_name: Option\u003c\u0026str\u003e,\n    tool_name: Option\u003c\u0026str\u003e,\n    hook_name: Option\u003c\u0026str\u003e,\n    project_root: \u0026Path,\n) -\u003e Result\u003c()\u003e {\n    let name = skill_name.or(tool_name).or(hook_name).ok_or_else(|| {\n        CoralError::new(\"--skill, --tool, or --hook is required when installing from a git URL\")\n    })?;\n\n    let (cache_dir, clean_url) = git::clone_or_fetch(url)?;\n    let commit_sha = git::resolve_ref(\u0026cache_dir)?;\n    let skill_dir = git::discover_skill(\u0026cache_dir, name)?;\n\n    let manifest = manifest::synthetic_manifest(\u0026skill_dir, name, \u0026commit_sha)?;\n    let capability = resolve_capability(\u0026manifest)?;\n\n    if scope == Scope::Project {\n        if let Some(warning) = resolver::check_collision(name, project_root, Some(\u0026clean_url))? {\n            eprintln!(\"{warning}\");\n        }\n    }\n\n    install_capability(install_root, scope, \u0026capability, \u0026manifest, target_ids, Some(\u0026SourceMetaInput {\n        source_type: \"git\".to_string(),\n        url: clean_url,\n        source_ref: commit_sha.clone(),\n        skill: name.to_string(),\n    }))\n}\n\nfn cmd_add_local(\n    install_root: \u0026Path,\n    scope: Scope,\n    capability: \u0026Path,\n    target_ids: \u0026[String],\n    project_root: \u0026Path,\n) -\u003e Result\u003c()\u003e {\n    let capability_dir = lockfile::absolutize(install_root, capability);\n    let capability = load_manifest(\u0026capability_dir)?;\n    let resolved = resolve_capability(\u0026capability)?;\n\n    if scope == Scope::Project {\n        if let Some(warning) = resolver::check_collision(\u0026capability.id, project_root, None)? {\n            eprintln!(\"{warning}\");\n        }\n    }\n\n    install_capability(install_root, scope, \u0026resolved, \u0026capability, target_ids, None)\n}\n\nstruct SourceMetaInput {\n    source_type: String,\n    url: String,\n    source_ref: String,\n    skill: String,\n}\n\nfn install_capability(\n    install_root: \u0026Path,\n    scope: Scope,\n    capability: \u0026adapter::ResolvedCapability,\n    manifest: \u0026manifest::CapabilityManifest,\n    target_ids: \u0026[String],\n    source_meta: Option\u003c\u0026SourceMetaInput\u003e,\n) -\u003e Result\u003c()\u003e {\n    let is_git = source_meta.is_some();\n\n    let mut adapters = Vec::new();\n    for tid in target_ids {\n        let adapter = AdapterKind::from_id(tid).ok_or_else(|| {\n            CoralError::new(format!(\n                \"unknown target '{}'; run 'coral target list' to see available targets\",\n                tid\n            ))\n        })?;\n        if !adapter.supports(\u0026capability.capability_type) {\n            return Err(CoralError::new(format!(\n                \"{} does not yet support {} capabilities\",\n                adapter.display_name(),\n                capability.capability_type\n            )));\n        }\n        if capability.capability_type == \"hook\" {\n            if let Some(ref hook_cfg) = capability.hook {\n                if !adapter.supported_events().contains(\u0026hook_cfg.event.as_str()) {\n                    return Err(CoralError::new(format!(\n                        \"{} does not support hook event '{}'. Supported events: {}\",\n                        adapter.display_name(),\n                        hook_cfg.event,\n                        adapter.supported_events().join(\", \")\n                    )));\n                }\n            }\n        }\n        adapters.push(adapter);\n    }\n\n    let mut plans: Vec\u003c(AdapterKind, Vec\u003cadapter::PlannedFile\u003e)\u003e = Vec::new();\n    for adapter in \u0026adapters {\n        let planned = adapter.plan(\u0026capability, install_root)?;\n        plans.push((*adapter, planned));\n    }\n\n    let lockfile = lockfile::require_lockfile(install_root)?;\n    for (adapter, planned_files) in \u0026plans {\n        let is_tracked = lockfile\n            .capabilities\n            .get(\u0026capability.id)\n            .and_then(|e| e.targets.get(adapter.id()))\n            .is_some();\n        if !is_tracked {\n            for f in planned_files {\n                let target_path = install_root.join(\u0026f.path);\n                if target_path.exists() {\n                    return Err(CoralError::new(format!(\n                        \"refusing to overwrite untracked file at {}; remove it or track it in Coral first\",\n                        lockfile::relative_or_absolute_fs(\u0026target_path, install_root)\n                    )));\n                }\n            }\n        }\n    }\n\n    let mut new_targets: BTreeMap\u003cString, TargetLockEntry\u003e = BTreeMap::new();\n\n    for (adapter, planned_files) in \u0026plans {\n        let mut emitted = Vec::new();\n\n        for planned in planned_files {\n            let target_path = install_root.join(\u0026planned.path);\n            if let Some(parent) = target_path.parent() {\n                std::fs::create_dir_all(parent)?;\n            }\n            std::fs::write(\u0026target_path, \u0026planned.content)?;\n\n            let hash = lockfile::hash_bytes(\u0026planned.content);\n            emitted.push(adapter::EmittedFile {\n                path: planned.path.clone(),\n                hash,\n            });\n\n            println!(\n                \"installed {} ({}) -\u003e {}\",\n                capability.id,\n                adapter.id(),\n                lockfile::relative_or_absolute_fs(\u0026target_path, install_root)\n            );\n        }\n\n        let baseline_dir = install_root\n            .join(\".coral\")\n            .join(\"baselines\")\n            .join(adapter.id())\n            .join(\u0026capability.id);\n        std::fs::create_dir_all(\u0026baseline_dir)?;\n\n        for planned in planned_files {\n            let file_name = Path::new(\u0026planned.path)\n                .file_name()\n                .expect(\"emitted file should have a name\");\n            std::fs::write(baseline_dir.join(file_name), \u0026planned.content)?;\n        }\n\n        let baseline_rel = lockfile::relative_or_absolute_fs(\u0026baseline_dir, install_root);\n        new_targets.insert(\n            adapter.id().to_string(),\n            TargetLockEntry {\n                baseline_dir: baseline_rel,\n                emitted_files: emitted,\n            },\n        );\n    }\n\n    // MCP registration for tool primitives\n    if capability.capability_type == \"tool\" {\n        if let Some(ref impl_cfg) = capability.implementation {\n            for adapter in \u0026adapters {\n                let mcp_path = match adapter {\n                    AdapterKind::OpenAgents =\u003e {\n                        install_root.join(\".agents\").join(\"mcp.json\")\n                    }\n                    AdapterKind::Claude =\u003e {\n                        install_root.join(\".mcp.json\")\n                    }\n                };\n\n                let mcp_command = impl_cfg.language.clone();\n                let entrypoint_path = match adapter {\n                    AdapterKind::OpenAgents =\u003e {\n                        format!(\".agents/tools/{}/{}\", capability.id, impl_cfg.entrypoint)\n                    }\n                    AdapterKind::Claude =\u003e {\n                        format!(\".claude/tools/{}/{}\", capability.id, impl_cfg.entrypoint)\n                    }\n                };\n                let mcp_args = vec![entrypoint_path];\n\n                crate::adapters::mcp_register_tool(\n                    install_root,\n                    \u0026mcp_path,\n                    \u0026capability.id,\n                    \u0026mcp_command,\n                    \u0026mcp_args,\n                )?;\n            }\n        }\n    }\n\n    let mut lockfile = lockfile;\n    let existing_targets = lockfile\n        .capabilities\n        .get(\u0026capability.id)\n        .map(|e| e.targets.clone())\n        .unwrap_or_default();\n\n    let mut merged_targets = existing_targets;\n    for (k, v) in new_targets {\n        merged_targets.insert(k, v);\n    }\n\n    let source_path = if is_git {\n        String::new()\n    } else {\n        lockfile::relative_or_absolute_fs(\u0026manifest.root, install_root)\n    };\n\n    lockfile.capabilities.insert(\n        capability.id.clone(),\n        lockfile::CapabilityLockEntry {\n            capability_type: capability.capability_type.clone(),\n            installed_version: capability.version.clone(),\n            source_path,\n            targets: merged_targets,\n            source: source_meta.map(|m| lockfile::SourceMetadata {\n                source_type: m.source_type.clone(),\n                url: m.url.clone(),\n                source_ref: m.source_ref.clone(),\n                skill: m.skill.clone(),\n            }),\n            scope: scope.as_str().to_string(),\n        },\n    );\n\n    lockfile::write_lockfile(install_root, \u0026lockfile)?;\n    Ok(())\n}\n\n// ── List ────────────────────────────────────────────────────────────────────\n\npub fn cmd_list(repo_root: \u0026Path, scope_filter: \u0026str, kind_filter: Option\u003c\u0026str\u003e) -\u003e Result\u003c()\u003e {\n    let show_project = scope_filter == \"all\" || scope_filter == \"project\";\n    let show_global = scope_filter == \"all\" || scope_filter == \"global\";\n\n    let mut rows: Vec\u003c(String, String, String, String, String, \u0026'static str)\u003e = Vec::new();\n\n    if show_project {\n        if let Ok(lockfile) = lockfile::require_lockfile(repo_root) {\n            for (id, entry) in \u0026lockfile.capabilities {\n                if let Some(kind) = kind_filter {\n                    if entry.capability_type != kind {\n                        continue;\n                    }\n                }\n                for (target_id, target_entry) in \u0026entry.targets {\n                    for emitted in \u0026target_entry.emitted_files {\n                        let status = lockfile::drift_status(repo_root, emitted);\n                        rows.push((\n                            id.clone(),\n                            entry.installed_version.clone(),\n                            \"project\".to_string(),\n                            target_id.clone(),\n                            emitted.path.clone(),\n                            status,\n                        ));\n                    }\n                }\n            }\n        }\n    }\n\n    if show_global {\n        if let Some(home) = home_dir_opt() {\n            let lock_path = home.join(\".coral\").join(\"coral-lock.json\");\n            if let Ok(lockfile) = lockfile::read_lockfile_at(\u0026lock_path) {\n                for (id, entry) in \u0026lockfile.capabilities {\n                    if let Some(kind) = kind_filter {\n                        if entry.capability_type != kind {\n                            continue;\n                        }\n                    }\n                    for (target_id, target_entry) in \u0026entry.targets {\n                        for emitted in \u0026target_entry.emitted_files {\n                            let status = lockfile::drift_status(\u0026home, emitted);\n                            rows.push((\n                                id.clone(),\n                                entry.installed_version.clone(),\n                                \"global\".to_string(),\n                                target_id.clone(),\n                                format!(\"~/{}\", emitted.path),\n                                status,\n                            ));\n                        }\n                    }\n                }\n            }\n        }\n    }\n\n    if rows.is_empty() {\n        println!(\"no capabilities installed\");\n        return Ok(());\n    }\n\n    rows.sort_by(|a, b| a.2.cmp(\u0026b.2).then_with(|| a.0.cmp(\u0026b.0)));\n\n    for (id, version, scope, target, path, status) in \u0026rows {\n        println!(\n            \"{}\\t{}\\t{}\\t{}\\t{}\\t{}\",\n            id, version, scope, target, status, path\n        );\n    }\n    Ok(())\n}\n\n// ── Status ──────────────────────────────────────────────────────────────────\n\npub fn cmd_status(repo_root: \u0026Path) -\u003e Result\u003c()\u003e {\n    let mut found_any = false;\n\n    if let Ok(lockfile) = lockfile::require_lockfile(repo_root) {\n        for (id, entry) in \u0026lockfile.capabilities {\n            let mut flags = Vec::new();\n            for (_, target_entry) in \u0026entry.targets {\n                for emitted in \u0026target_entry.emitted_files {\n                    let s = lockfile::drift_status(repo_root, emitted);\n                    if s != \"clean\" {\n                        flags.push(s);\n                    }\n                }\n            }\n\n            let override_warning = if resolver::overrides_global(id, repo_root).unwrap_or(false) {\n                \" [overrides global — won't receive global updates]\"\n            } else {\n                \"\"\n            };\n\n            let drift = if flags.is_empty() {\n                \"clean\".to_string()\n            } else {\n                flags.join(\",\")\n            };\n\n            println!(\"{id}  project  {drift}{override_warning}\");\n            found_any = true;\n        }\n    }\n\n    if let Some(home) = home_dir_opt() {\n        let lock_path = home.join(\".coral\").join(\"coral-lock.json\");\n        if let Ok(lockfile) = lockfile::read_lockfile_at(\u0026lock_path) {\n            for (id, entry) in \u0026lockfile.capabilities {\n                let mut flags = Vec::new();\n                for (_, target_entry) in \u0026entry.targets {\n                    for emitted in \u0026target_entry.emitted_files {\n                        let s = lockfile::drift_status(\u0026home, emitted);\n                        if s != \"clean\" {\n                            flags.push(s);\n                        }\n                    }\n                }\n\n                let is_shadowed = {\n                    lockfile::require_lockfile(repo_root)\n                        .map(|plf| plf.capabilities.contains_key(id))\n                        .unwrap_or(false)\n                };\n\n                let note = if is_shadowed {\n                    \" [shadowed by project copy]\"\n                } else {\n                    \"\"\n                };\n\n                let drift = if flags.is_empty() {\n                    \"clean\".to_string()\n                } else {\n                    flags.join(\",\")\n                };\n\n                println!(\"{id}  global   {drift}{note}\");\n                found_any = true;\n            }\n        }\n    }\n\n    if !found_any {\n        println!(\"no capabilities installed\");\n    }\n\n    Ok(())\n}\n\n// ── Diff ────────────────────────────────────────────────────────────────────\n\npub fn cmd_diff(\n    repo_root: \u0026Path,\n    capability_id: \u0026str,\n    target: Option\u003c\u0026str\u003e,\n    upstream: bool,\n) -\u003e Result\u003c()\u003e {\n    let (scope, entry, scope_root) = match resolver::resolve_entry(capability_id, repo_root)? {\n        Some((s, e)) =\u003e {\n            let root = match s {\n                Scope::Project =\u003e repo_root.to_path_buf(),\n                Scope::Global =\u003e home_dir()?,\n            };\n            (s, e, root)\n        }\n        None =\u003e {\n            return Err(CoralError::new(format!(\n                \"capability is not installed: {capability_id}\"\n            )));\n        }\n    };\n\n    let _ = scope;\n\n    if upstream {\n        return cmd_diff_upstream(scope_root, capability_id, \u0026entry, target);\n    }\n\n    let mut output = String::new();\n\n    if let Some(tid) = target {\n        output.push_str(\u0026lockfile::diff_against_baseline(\n            \u0026scope_root,\n            capability_id,\n            tid,\n            \u0026entry,\n        )?);\n    } else {\n        let mut first = true;\n        for tid in entry.targets.keys() {\n            let diff = lockfile::diff_against_baseline(\u0026scope_root, capability_id, tid, \u0026entry)?;\n            if diff.is_empty() {\n                continue;\n            }\n            if !first {\n                output.push('\\n');\n            }\n            output.push_str(\u0026diff);\n            first = false;\n        }\n    }\n\n    print!(\"{output}\");\n    Ok(())\n}\n\nfn cmd_diff_upstream(\n    scope_root: PathBuf,\n    _capability_id: \u0026str,\n    entry: \u0026lockfile::CapabilityLockEntry,\n    target: Option\u003c\u0026str\u003e,\n) -\u003e Result\u003c()\u003e {\n    let source = entry.source.as_ref().ok_or_else(|| {\n        CoralError::new(\"upstream diff only available for git-sourced primitives\")\n    })?;\n\n    let (cache_dir, _) = git::clone_or_fetch(\u0026source.url)?;\n    let mut output = String::new();\n\n    for (tid, target_entry) in \u0026entry.targets {\n        if let Some(t) = target {\n            if tid != t {\n                continue;\n            }\n        }\n\n        let baseline_dir = scope_root.join(\u0026target_entry.baseline_dir);\n        for emitted in \u0026target_entry.emitted_files {\n            let file_name = std::path::Path::new(\u0026emitted.path)\n                .file_name()\n                .unwrap_or_default()\n                .to_string_lossy();\n\n            let upstream_content = crate::diff::get_upstream_content(\n                \u0026cache_dir,\n                \u0026source.skill,\n                \u0026file_name,\n            )?;\n            let baseline_path = baseline_dir.join(file_name.as_ref());\n            let baseline_content = std::fs::read_to_string(\u0026baseline_path)?;\n\n            if baseline_content == upstream_content {\n                continue;\n            }\n\n            output.push_str(\u0026format!(\n                \"--- baseline/{}\\n+++ upstream/{}/{}\\n\",\n                file_name, tid, file_name\n            ));\n            let diff =\n                similar::TextDiff::from_lines(\u0026baseline_content, \u0026upstream_content);\n            for group in diff.grouped_ops(3) {\n                for operation in group {\n                    for change in diff.iter_changes(\u0026operation) {\n                        let sign = match change.tag() {\n                            similar::ChangeTag::Delete =\u003e \"-\",\n                            similar::ChangeTag::Insert =\u003e \"+\",\n                            similar::ChangeTag::Equal =\u003e \" \",\n                        };\n                        output.push_str(sign);\n                        output.push_str(change.value());\n                    }\n                }\n            }\n        }\n    }\n\n    if output.is_empty() {\n        println!(\"no upstream changes\");\n    } else {\n        print!(\"{output}\");\n    }\n\n    Ok(())\n}\n\n// ── Remove ──────────────────────────────────────────────────────────────────\n\npub fn cmd_remove(\n    repo_root: \u0026Path,\n    id: \u0026str,\n    scope_str: \u0026str,\n    targets: Option\u003c\u0026[String]\u003e,\n) -\u003e Result\u003c()\u003e {\n    let scope = resolver::Scope::from_str(scope_str)\n        .ok_or_else(|| CoralError::new(format!(\"invalid scope '{}'\", scope_str)))?;\n\n    let scope_root = match scope {\n        Scope::Project =\u003e repo_root.to_path_buf(),\n        Scope::Global =\u003e home_dir()?,\n    };\n\n    let mut lockfile = lockfile::require_lockfile(\u0026scope_root)?;\n    let entry = lockfile.capabilities.remove(id).ok_or_else(|| {\n        CoralError::new(format!(\"'{}' is not installed in {} scope\", id, scope.as_str()))\n    })?;\n\n    let mut modified = false;\n    for (_, target_entry) in \u0026entry.targets {\n        for emitted in \u0026target_entry.emitted_files {\n            if lockfile::drift_status(\u0026scope_root, emitted) == \"modified\" {\n                modified = true;\n            }\n        }\n    }\n    if modified {\n        eprintln!(\"warning: '{}' has local modifications — removing will discard them\", id);\n    }\n\n    let adapter_ids: Vec\u003cString\u003e = if let Some(tgts) = targets {\n        tgts.to_vec()\n    } else {\n        entry.targets.keys().cloned().collect()\n    };\n\n    for tid in \u0026adapter_ids {\n        if let Some(adapter) = AdapterKind::from_id(tid) {\n            adapter.remove(id, \u0026scope_root)?;\n\n            let baseline_dir = scope_root\n                .join(\".coral\")\n                .join(\"baselines\")\n                .join(tid)\n                .join(id);\n            if baseline_dir.exists() {\n                std::fs::remove_dir_all(\u0026baseline_dir)?;\n            }\n        }\n    }\n\n    lockfile::write_lockfile(\u0026scope_root, \u0026lockfile)?;\n    println!(\"removed '{}' from {} scope\", id, scope.as_str());\n    Ok(())\n}\n\n// ── Update ──────────────────────────────────────────────────────────────────\n\npub fn cmd_update(\n    repo_root: \u0026Path,\n    id: \u0026str,\n    scope_str: Option\u003c\u0026str\u003e,\n    check: bool,\n    force: bool,\n) -\u003e Result\u003c()\u003e {\n    let (scope, entry, scope_root) = if let Some(s) = scope_str {\n        let scope = resolver::Scope::from_str(s)\n            .ok_or_else(|| CoralError::new(format!(\"invalid scope '{}'\", s)))?;\n        let root = match scope {\n            Scope::Project =\u003e repo_root.to_path_buf(),\n            Scope::Global =\u003e home_dir()?,\n        };\n        let lf = lockfile::require_lockfile(\u0026root)?;\n        let entry = lf.capabilities.get(id).ok_or_else(|| {\n            CoralError::new(format!(\n                \"'{}' is not installed in {} scope\",\n                id,\n                scope.as_str()\n            ))\n        })?;\n        (scope, entry.clone(), root)\n    } else {\n        match resolver::resolve_entry(id, repo_root)? {\n            Some((s, e)) =\u003e {\n                let root = match s {\n                    Scope::Project =\u003e repo_root.to_path_buf(),\n                    Scope::Global =\u003e home_dir()?,\n                };\n                (s, e, root)\n            }\n            None =\u003e {\n                return Err(CoralError::new(format!(\"'{}' is not installed\", id)));\n            }\n        }\n    };\n\n    let source = entry.source.as_ref().ok_or_else(|| {\n        CoralError::new(\n            format!(\"'{}' is not a git-sourced capability — update only works for git sources\", id),\n        )\n    })?;\n\n    let (cache_dir, _clean_url) = git::clone_or_fetch(\u0026source.url)?;\n    let latest_sha = git::resolve_ref(\u0026cache_dir)?;\n\n    if latest_sha == entry.installed_version {\n        println!(\"'{}' is already up to date\", id);\n        return Ok(());\n    }\n\n    let skill_dir = git::discover_skill(\u0026cache_dir, \u0026source.skill)?;\n\n    if force {\n        let manifest = manifest::synthetic_manifest(\u0026skill_dir, id, \u0026latest_sha)?;\n        let capability = resolve_capability(\u0026manifest)?;\n        let target_ids: Vec\u003cString\u003e = entry.targets.keys().cloned().collect();\n        return install_capability(\n            \u0026scope_root,\n            scope,\n            \u0026capability,\n            \u0026manifest,\n            \u0026target_ids,\n            Some(\u0026SourceMetaInput {\n                source_type: \"git\".to_string(),\n                url: source.url.clone(),\n                source_ref: latest_sha.clone(),\n                skill: source.skill.clone(),\n            }),\n        );\n    }\n\n    let mut all_clean = true;\n    let mut had_conflicts = false;\n    let mut would_overwrite = false;\n\n    for (_tid, target_entry) in \u0026entry.targets {\n        let baseline_dir = scope_root.join(\u0026target_entry.baseline_dir);\n        for emitted in \u0026target_entry.emitted_files {\n            let file_name = std::path::Path::new(\u0026emitted.path)\n                .file_name()\n                .unwrap_or_default()\n                .to_string_lossy();\n\n            let local_path = scope_root.join(\u0026emitted.path);\n            let baseline_path = baseline_dir.join(\u0026*file_name);\n            let upstream_path = skill_dir.join(\u0026*file_name);\n\n            let local_content = std::fs::read_to_string(\u0026local_path).unwrap_or_default();\n            let baseline_content = std::fs::read_to_string(\u0026baseline_path).unwrap_or_default();\n            let upstream_content = std::fs::read_to_string(\u0026upstream_path).unwrap_or_default();\n\n            if local_content == upstream_content {\n                continue;\n            }\n\n            let local_status = lockfile::drift_status(\u0026scope_root, emitted);\n            if local_status != \"clean\" || local_content != baseline_content {\n                all_clean = false;\n                would_overwrite = true;\n            }\n\n            if !check {\n                let report = crate::diff::merge_and_write(\n                    \u0026baseline_path,\n                    \u0026local_path,\n                    \u0026upstream_path,\n                )?;\n\n                if let Some(reports) = report {\n                    had_conflicts = true;\n                    for r in reports {\n                        for c in \u0026r.conflicts {\n                            eprintln!(\"  ✗ {}: {}\", r.file_path, c.description);\n                            eprintln!(\"    \u003c\u003c\u003c\u003c\u003c\u003c local\\n{}\\n    ======\", c.local.trim());\n                            eprintln!(\"    {}\\n    \u003e\u003e\u003e\u003e\u003e\u003e upstream\", c.upstream.trim());\n                        }\n                    }\n                    eprintln!(\n                        \"\\n  To write conflict markers: coral update {} --write-conflicts\",\n                        id\n                    );\n                }\n            }\n        }\n    }\n\n    if check {\n        if all_clean {\n            println!(\"'{}' can be updated cleanly (no local changes)\", id);\n        } else if would_overwrite {\n            println!(\"'{}' has local changes — update would attempt three-way merge\", id);\n        } else {\n            println!(\"'{}' is up to date\", id);\n        }\n        return Ok(());\n    }\n\n    if had_conflicts {\n        return Err(CoralError::new(\n            \"conflicts found — local files have not been modified. Resolve conflicts manually or use --force to overwrite.\",\n        ));\n    }\n\n    let manifest = manifest::synthetic_manifest(\u0026skill_dir, id, \u0026latest_sha)?;\n    let primitive = resolve_capability(\u0026manifest)?;\n    let target_ids: Vec\u003cString\u003e = entry.targets.keys().cloned().collect();\n\n    install_capability(\n        \u0026scope_root,\n        scope,\n        \u0026primitive,\n        \u0026manifest,\n        \u0026target_ids,\n        Some(\u0026SourceMetaInput {\n            source_type: \"git\".to_string(),\n            url: source.url.clone(),\n            source_ref: latest_sha.clone(),\n            skill: source.skill.clone(),\n        }),\n    )\n}\n\n// ── Outdated ────────────────────────────────────────────────────────────────\n\nfn short_sha(v: \u0026str) -\u003e \u0026str {\n    if v.len() \u003e= 7 \u0026\u0026 v.chars().all(|c| c.is_ascii_hexdigit()) {\n        \u0026v[..7]\n    } else {\n        v\n    }\n}\n\npub fn cmd_outdated(repo_root: \u0026Path) -\u003e Result\u003c()\u003e {\n    #[derive(Tabled)]\n    struct OutdatedRow {\n        #[tabled(rename = \"ID\")]\n        id: String,\n        #[tabled(rename = \"TYPE\")]\n        capability_type: String,\n        #[tabled(rename = \"TARGET\")]\n        target: String,\n        #[tabled(rename = \"CURRENT\")]\n        current: String,\n        #[tabled(rename = \"LATEST\")]\n        latest: String,\n        #[tabled(rename = \"STATUS\")]\n        status: String,\n    }\n\n    let mut rows: Vec\u003cOutdatedRow\u003e = Vec::new();\n\n    if let Ok(lockfile) = lockfile::require_lockfile(repo_root) {\n        for (id, entry) in \u0026lockfile.capabilities {\n            for (target_id, _target_entry) in \u0026entry.targets {\n                let (current, latest, status) = if let Some(src) = \u0026entry.source {\n                    let latest_sha = match git::clone_or_fetch(\u0026src.url)\n                        .and_then(|(d, _)| git::resolve_ref(\u0026d))\n                    {\n                        Ok(sha) =\u003e sha,\n                        Err(_) =\u003e {\n                            rows.push(OutdatedRow {\n                                id: id.clone(),\n                                capability_type: entry.capability_type.clone(),\n                                target: target_id.clone(),\n                                current: short_sha(\u0026entry.installed_version).to_string(),\n                                latest: \"unavailable\".to_string(),\n                                status: \"error\".to_string(),\n                            });\n                            continue;\n                        }\n                    };\n                    if latest_sha == entry.installed_version {\n                        (\n                            short_sha(\u0026entry.installed_version).to_string(),\n                            short_sha(\u0026latest_sha).to_string(),\n                            \"up to date\".to_string(),\n                        )\n                    } else {\n                        (\n                            short_sha(\u0026entry.installed_version).to_string(),\n                            short_sha(\u0026latest_sha).to_string(),\n                            \"outdated\".to_string(),\n                        )\n                    }\n                } else {\n                    (\n                        entry.installed_version.clone(),\n                        \"—\".to_string(),\n                        \"up to date\".to_string(),\n                    )\n                };\n\n                rows.push(OutdatedRow {\n                    id: id.clone(),\n                    capability_type: entry.capability_type.clone(),\n                    target: target_id.clone(),\n                    current,\n                    latest,\n                    status,\n                });\n            }\n        }\n    }\n\n    if let Some(home) = home_dir_opt() {\n        let lock_path = home.join(\".coral\").join(\"coral-lock.json\");\n        if let Ok(lockfile) = lockfile::read_lockfile_at(\u0026lock_path) {\n            for (id, entry) in \u0026lockfile.capabilities {\n                for (target_id, _target_entry) in \u0026entry.targets {\n                    let (current, latest, status) = if let Some(src) = \u0026entry.source {\n                        let latest_sha = match git::clone_or_fetch(\u0026src.url)\n                            .and_then(|(d, _)| git::resolve_ref(\u0026d))\n                        {\n                            Ok(sha) =\u003e sha,\n                            Err(_) =\u003e {\n                                rows.push(OutdatedRow {\n                                    id: id.clone(),\n                                    capability_type: entry.capability_type.clone(),\n                                    target: target_id.clone(),\n                                    current: short_sha(\u0026entry.installed_version)\n                                        .to_string(),\n                                    latest: \"unavailable\".to_string(),\n                                    status: \"error\".to_string(),\n                                });\n                                continue;\n                            }\n                        };\n                        if latest_sha == entry.installed_version {\n                            (\n                                short_sha(\u0026entry.installed_version).to_string(),\n                                short_sha(\u0026latest_sha).to_string(),\n                                \"up to date\".to_string(),\n                            )\n                        } else {\n                            (\n                                short_sha(\u0026entry.installed_version).to_string(),\n                                short_sha(\u0026latest_sha).to_string(),\n                                \"outdated\".to_string(),\n                            )\n                        }\n                    } else {\n                        (\n                            entry.installed_version.clone(),\n                            \"—\".to_string(),\n                            \"up to date\".to_string(),\n                        )\n                    };\n\n                    rows.push(OutdatedRow {\n                        id: id.clone(),\n                        capability_type: entry.capability_type.clone(),\n                        target: target_id.clone(),\n                        current,\n                        latest,\n                        status,\n                    });\n                }\n            }\n        }\n    }\n\n    if rows.is_empty() {\n        println!(\"no capabilities installed\");\n        return Ok(());\n    }\n\n    rows.sort_by(|a, b| a.id.cmp(\u0026b.id));\n\n    let use_color = std::env::var_os(\"NO_COLOR\").is_none();\n    let green = if use_color { \"\\x1b[32m\" } else { \"\" };\n    let red = if use_color { \"\\x1b[31m\" } else { \"\" };\n    let reset = if use_color { \"\\x1b[0m\" } else { \"\" };\n\n    let styled_rows: Vec\u003cOutdatedRow\u003e = rows\n        .into_iter()\n        .map(|r| {\n            let status = match r.status.as_str() {\n                \"up to date\" =\u003e format!(\"  {green}●{reset} {}\", r.status),\n                \"outdated\" =\u003e format!(\"  {red}●{reset} {}\", r.status),\n                \"error\" =\u003e format!(\"  {red}●{reset} {}\", r.status),\n                _ =\u003e r.status,\n            };\n            OutdatedRow { status, ..r }\n        })\n        .collect();\n\n    let mut table = Table::new(styled_rows);\n    table.with(Style::modern());\n\n    println!(\"{table}\");\n    Ok(())\n}\n\n// ── Target commands (unchanged) ─────────────────────────────────────────────\n\npub fn cmd_target_list(repo_root: \u0026Path) -\u003e Result\u003c()\u003e {\n    #[derive(Tabled)]\n    struct TargetRow {\n        #[tabled(rename = \"TARGET\")]\n        target: String,\n        #[tabled(rename = \"AGENTS SUPPORTED\")]\n        agents: String,\n        #[tabled(rename = \"PRIMITIVES\")]\n        primitives: String,\n    }\n\n    let config = config::read_config(repo_root)?;\n    let registered: std::collections::HashSet\u003c\u0026str\u003e =\n        config.targets.iter().map(|s| s.as_str()).collect();\n\n    let rows: Vec\u003cTargetRow\u003e = AdapterKind::all()\n        .iter()\n        .map(|a| {\n            let target_label = if registered.contains(a.id()) {\n                format!(\"{} *\", a.id())\n            } else {\n                a.id().to_string()\n            };\n            TargetRow {\n                target: target_label,\n                agents: a.supported_agents().join(\", \"),\n                primitives: a.kinds_supported().join(\", \"),\n            }\n        })\n        .collect();\n\n    let mut table = Table::new(rows);\n    table\n        .with(Style::modern())\n        .with(Modify::new(Columns::single(1)).with(\n            Width::wrap(40).keep_words(true),\n        ));\n\n    println!(\"{table}\");\n\n    if registered.is_empty() {\n        println!(\"\\n  *  = registered (use 'coral target add \u003cid\u003e' to register)\");\n    }\n    Ok(())\n}\n\npub fn cmd_target_add(repo_root: \u0026Path, id: \u0026str) -\u003e Result\u003c()\u003e {\n    let adapter = AdapterKind::from_id(id).ok_or_else(|| {\n        CoralError::new(format!(\n            \"unknown target '{}'; use 'coral target list' to see available targets\",\n            id\n        ))\n    })?;\n\n    let mut config = config::read_config(repo_root)?;\n    if config.targets.contains(\u0026id.to_string()) {\n        println!(\"target '{}' is already registered\", id);\n        return Ok(());\n    }\n\n    config.targets.push(id.to_string());\n    config::write_config(repo_root, \u0026config)?;\n    println!(\n        \"registered target '{}' ({})\",\n        adapter.id(),\n        adapter.display_name()\n    );\n    Ok(())\n}\n\npub fn cmd_target_remove(repo_root: \u0026Path, id: \u0026str) -\u003e Result\u003c()\u003e {\n    let adapter = AdapterKind::from_id(id).ok_or_else(|| {\n        CoralError::new(format!(\n            \"unknown target '{}'; use 'coral target list' to see available targets\",\n            id\n        ))\n    })?;\n\n    let mut config = config::read_config(repo_root)?;\n eturn None;\n    }\n\n    match merge(baseline, local, upstream) {\n        Ok(_merged) =\u003e None,\n        Err(conflict_text) =\u003e {\n            // Extract conflict blocks from the merge output\n            let mut blocks = Vec::new();\n            let mut in_conflict = false;\n            let mut local_lines = Vec::new();\n            let mut upstream_lines = Vec::new();\n            let mut line_start = 0;\n\n            for (i, line) in conflict_text.lines().enumerate() {\n                if line.starts_with(\"\u003c\u003c\u003c\u003c\u003c\u003c\") {\n                    in_conflict = true;\n                    local_lines.clear();\n                    upstream_lines.clear();\n                    line_start = i;\n                } else if line.starts_with(\"======\") {\n                    std::mem::swap(\u0026mut local_lines, \u0026mut upstream_lines);\n                } else if line.starts_with(\"\u003e\u003e\u003e\u003e\u003e\u003e\") {\n                    in_conflict = false;\n                    blocks.push(ConflictBlock {\n                        description: format!(\n                            \"Conflict in \\\"{}\\\" (lines {}-{})\",\n                            file_name,\n                            line_start + 1,\n                            i + 1\n                        ),\n                        local: local_lines.join(\"\\n\"),\n                        upstream: upstream_lines.join(\"\\n\"),\n                    });\n                    local_lines.clear();\n                    upstream_lines.clear();\n                } else if in_conflict {\n                    if upstream_lines.is_empty() {\n                        local_lines.push(line.to_string());\n                    } else {\n                        upstream_lines.push(line.to_string());\n                    }\n                }\n            }\n            Some(ConflictReport {\n                file_path: file_name.to_string(),\n                conflicts: blocks,\n            })\n        }\n    }\n}\n\npub fn merge_and_write(\n    baseline_path: \u0026Path,\n    local_path: \u0026Path,\n    upstream_path: \u0026Path,\n) -\u003e Result\u003cOption\u003cVec\u003cConflictReport\u003e\u003e\u003e {\n    let mut reports = Vec::new();\n\n    let baseline = std::fs::read_to_string(baseline_path)?;\n    let local = std::fs::read_to_string(local_path)?;\n    let upstream = std::fs::read_to_string(upstream_path)?;\n\n    if local == upstream {\n        return Ok(None);\n    }\n\n    if local == baseline {\n        // clean local, upstream changed → apply upstream\n        std::fs::write(local_path, \u0026upstream)?;\n        return Ok(None);\n    }\n\n    if upstream == baseline {\n        // modified local, upstream unchanged → no-op\n        return Ok(None);\n    }\n\n    // modified local, changed upstream → attempt merge\n    let file_name = local_path\n        .file_name()\n        .unwrap_or_default()\n        .to_string_lossy();\n\n    match merge(\u0026baseline, \u0026local, \u0026upstream) {\n        Ok(merged) =\u003e {\n            // clean merge — write merged result\n            std::fs::write(local_path, \u0026merged)?;\n            Ok(None)\n        }\n        Err(conflict_text) =\u003e {\n            let mut blocks = Vec::new();\n            let mut in_conflict = false;\n            let mut local_lines: Vec\u003cString\u003e = Vec::new();\n            let mut upstream_lines: Vec\u003cString\u003e = Vec::new();\n            let mut line_start = 0;\n\n            for (i, line) in conflict_text.lines().enumerate() {\n                if line.starts_with(\"\u003c\u003c\u003c\u003c\u003c\u003c\") {\n                    local_lines.clear();\n                    upstream_lines.clear();\n                    line_start = i;\n                    in_conflict = true;\n                } else if in_conflict \u0026\u0026 line.starts_with(\"======\") {\n                    std::mem::swap(\u0026mut local_lines, \u0026mut upstream_lines);\n                } else if in_conflict \u0026\u0026 line.starts_with(\"\u003e\u003e\u003e\u003e\u003e\u003e\") {\n                    in_conflict = false;\n                    blocks.push(ConflictBlock {\n                        description: format!(\n                            \"Conflict in \\\"{}\\\" (lines {}-{})\",\n                            file_name,\n                            line_start + 1,\n                            i + 1\n                        ),\n                        local: local_lines.join(\"\\n\"),\n                        upstream: upstream_lines.join(\"\\n\"),\n                    });\n                    local_lines.clear();\n                    upstream_lines.clear();\n                } else if in_conflict {\n                    local_lines.push(line.to_string());\n                }\n            }\n            reports.push(ConflictReport {\n                file_path: file_name.to_string(),\n                conflicts: blocks,\n            });\n            Ok(Some(reports))\n        }\n    }\n}\n\npub fn get_upstream_content(\n    cache_dir: \u0026Path,\n    skill_name: \u0026str,\n    file_rel_path: \u0026str,\n) -\u003e Result\u003cString\u003e {\n    let skill_dir = crate::git::discover_skill(cache_dir, skill_name)?;\n    let full_path = skill_dir.join(file_rel_path);\n    if !full_path.exists() {\n        return Err(CoralError::new(format!(\n            \"upstream file not found: {}\",\n            full_path.display()\n        )));\n    }\n    Ok(std::fs::read_to_string(full_path)?)\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn merge_clean_local_upstream_changed_returns_none() {\n        assert!(three_way_merge(\"file.md\", \"original\", \"original\", \"modified upstream\").is_none());\n    }\n\n    #[test]\n    fn merge_local_unchanged_returns_none_when_same() {\n        assert!(three_way_merge(\"file.md\", \"original\", \"original\", \"original\").is_none());\n    }\n\n    #[test]\n    fn merge_conflict_both_changed_reports_conflicts() {\n        let report = three_way_merge(\n            \"file.md\",\n            \"original\",\n            \"local change\",\n            \"upstream change\",\n        );\n        assert!(report.is_some());\n        assert_eq!(report.unwrap().file_path, \"file.md\");\n    }\n\n    #[test]\n    fn merge_non_conflicting_changes_succeeds() {\n        let report = three_way_merge(\n            \"file.md\",\n            \"line1\\nline2\\nline3\\nline4\",\n            \"line1\\nline2 local\\nline3\\nline4\",\n            \"line1\\nline2\\nline3\\nline4 upstream\",\n        );\n        assert!(report.is_none());\n    }\n\n    #[test]\n    fn diff_baseline_vs_local_shows_changes() {\n        let tmp = tempfile::TempDir::new().unwrap();\n        let base = tmp.path().join(\"base.md\");\n        let local = tmp.path().join(\"local.md\");\n        std::fs::write(\u0026base, \"hello world\").unwrap();\n        std::fs::write(\u0026local, \"hello modified\").unwrap();\n        let diff = diff_baseline_vs_local(\u0026base, \u0026local).unwrap();\n        assert!(diff.contains(\"-hello world\"));\n        assert!(diff.contains(\"+hello modified\"));\n    }\n\n    #[test]\n    fn diff_identical_files_returns_empty() {\n        let tmp = tempfile::TempDir::new().unwrap();\n        let base = tmp.path().join(\"base.md\");\n        std::fs::write(\u0026base, \"same\").unwrap();\n        let local = tmp.path().join(\"local.md\");\n        std::fs::write(\u0026local, \"same\").unwrap();\n        assert!(diff_baseline_vs_local(\u0026base, \u0026local).unwrap().is_empty());\n    }\n}\n","traces":[{"line":20,"address":[],"length":0,"stats":{"Line":2}},{"line":24,"address":[],"length":0,"stats":{"Line":6}},{"line":25,"address":[],"length":0,"stats":{"Line":6}},{"line":27,"address":[],"length":0,"stats":{"Line":2}},{"line":28,"address":[],"length":0,"stats":{"Line":1}},{"line":31,"address":[],"length":0,"stats":{"Line":4}},{"line":32,"address":[],"length":0,"stats":{"Line"  .join(\"git\")\n        .join(hash_url(\u0026clean_url));\n\n    if cache_dir.join(\".git\").exists() {\n        let status = Command::new(\"git\")\n            .args([\"fetch\", \"origin\"])\n            .current_dir(\u0026cache_dir)\n            .status()?;\n        if !status.success() {\n            return Err(CoralError::new(format!(\n                \"git fetch failed for {}\",\n                clean_url\n            )));\n        }\n\n        let status = Command::new(\"git\")\n            .args([\"reset\", \"--hard\", \"origin/HEAD\"])\n            .current_dir(\u0026cache_dir)\n            .status()?;\n        if !status.success() {\n            return Err(CoralError::new(\"git reset --hard failed\"));\n        }\n    } else {\n        std::fs::create_dir_all(cache_dir.parent().unwrap())?;\n\n        let mut cmd = Command::new(\"git\");\n        cmd.args([\"clone\", \"--depth\", \"1\"]);\n        if let Some(ref b) = branch {\n            cmd.args([\"--branch\", b]);\n        }\n        cmd.arg(\u0026clean_url).arg(\u0026cache_dir);\n        let status = cmd.status()?;\n        if !status.success() {\n            return Err(CoralError::new(format!(\n                \"git clone failed for {}; is the repo accessible?\",\n                clean_url\n            )));\n        }\n    }\n\n    Ok((cache_dir, clean_url))\n}\n\npub fn resolve_ref(repo: \u0026Path) -\u003e Result\u003cString\u003e {\n    let output = Command::new(\"git\")\n        .args([\"rev-parse\", \"HEAD\"])\n        .current_dir(repo)\n        .output()?;\n\n    if !output.status.success() {\n        return Err(CoralError::new(\"failed to resolve git ref\"));\n    }\n\n    let sha = String::from_utf8_lossy(\u0026output.stdout).trim().to_string();\n    if sha.is_empty() {\n        return Err(CoralError::new(\"empty git ref\"));\n    }\n    Ok(sha)\n}\n\npub fn discover_skill(repo: \u0026Path, name: \u0026str) -\u003e Result\u003cPathBuf\u003e {\n    let mut matches = Vec::new();\n\n    // Pattern 1: skills/\u003cname\u003e/SKILL.md\n    let p1 = repo.join(\"skills\").join(name);\n    if p1.join(\"SKILL.md\").exists() {\n        matches.push(p1);\n    }\n\n    // Pattern 2: \u003cname\u003e/SKILL.md (root level)\n    let p2 = repo.join(name);\n    if p2.join(\"SKILL.md\").exists() {\n        matches.push(p2);\n    }\n\n    // Pattern 3: Walk skills/ subdirs for \u003ccategory\u003e/\u003cname\u003e/SKILL.md\n    let skills_dir = repo.join(\"skills\");\n    if skills_dir.is_dir() {\n        for entry in std::fs::read_dir(\u0026skills_dir)? {\n            let entry = entry?;\n            if entry.file_type()?.is_dir() {\n                let candidate = entry.path().join(name);\n                if candidate.join(\"SKILL.md\").exists() {\n                    matches.push(candidate);\n                }\n            }\n        }\n    }\n\n    match matches.len() {\n        0 =\u003e {\n            let nearby = list_nearby_skills(repo)?;\n            let hint = if nearby.is_empty() {\n                String::new()\n            } else {\n                format!(\"\\nAvailable skills: {}\", nearby.join(\", \"))\n            };\n            Err(CoralError::new(format!(\n                \"skill '{}' not found in repository{hint}\",\n                name\n            )))\n        }\n        1 =\u003e Ok(matches[0].clone()),\n        _ =\u003e {\n            let paths: Vec\u003c_\u003e = matches\n                .iter()\n                .map(|p| p.strip_prefix(repo).unwrap_or(p).display().to_string())\n                .collect();\n            Err(CoralError::new(format!(\n                \"ambiguous skill name '{}' matches multiple paths: {}\",\n                name,\n                paths.join(\", \")\n            )))\n        }\n    }\n}\n\nfn list_nearby_skills(repo: \u0026Path) -\u003e Result\u003cVec\u003cString\u003e\u003e {\n    let skills_dir = repo.join(\"skills\");\n    if !skills_dir.is_dir() {\n        return Ok(Vec::new());\n    }\n\n    let mut skills = Vec::new();\n    for entry in std::fs::read_dir(\u0026skills_dir)? {\n        let entry = entry?;\n        if entry.file_type()?.is_dir() {\n            let path = entry.path();\n            let name = entry.file_name().to_string_lossy().to_string();\n            if !name.starts_with('.') \u0026\u0026 path.join(\"SKILL.md\").exists() {\n                skills.push(name);\n            }\n        }\n    }\n    skills.sort();\n    Ok(skills)\n}\n\nfn dirs_home() -\u003e Result\u003cPathBuf\u003e {\n    #[cfg(unix)]\n    {\n        std::env::var(\"HOME\")\n            .map(PathBuf::from)\n            .map_err(|_| CoralError::new(\"HOME environment variable not set\"))\n    }\n    #[cfg(windows)]\n    {\n        std::env::var(\"USERPROFILE\")\n            .map(PathBuf::from)\n            .or_else(|_| {\n                std::env::var(\"HOMEDRIVE\")\n                    .and_then(|hd| std::env::var(\"HOMEPATH\").map(|hp| format!(\"{}{}\", hd, hp)))\n            })\n            .map(PathBuf::from)\n            .map_err(|_| CoralError::new(\"home directory not found\"))\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn detect_github_clean_url() {\n        assert!(is_git_url(\"https://github.com/owner/repo\"));\n        assert!(is_git_url(\"http://github.com/owner/repo\"));\n    }\n\n    #[test]\n    fn detect_github_tree_url() {\n        assert!(is_git_url(\"https://github.com/owner/repo/tree/main/skills\"));\n    }\n\n    #[test]\n    fn detect_ssh_url() {\n        assert!(is_git_url(\"git@github.com:owner/repo.git\"));\n    }\n\n    #[test]\n    fn detect_file_url() {\n        assert!(is_git_url(\"file:///path/to/repo\"));\n    }\n\n    #[test]\n    fn reject_local_path() {\n        assert!(!is_git_url(\"./my-skill\"));\n        assert!(!is_git_url(\"/absolute/path\"));\n    }\n\n    #[test]\n    fn clean_github_tree_extracts_repo_and_branch() {\n        let (url, branch) = clean_git_url(\"https://github.com/owner/repo/tree/main/skills\");\n        assert_eq!(url, \"https://github.com/owner/repo\");\n        assert_eq!(branch, Some(\"main\".to_string()));\n    }\n\n    #[test]\n    fn clean_github_blob_extracts_repo_and_branch() {\n        let (url, branch) = clean_git_url(\"https://github.com/owner/repo/blob/main/README.md\");\n        assert_eq!(url, \"https://github.com/owner/repo\");\n        assert_eq!(branch, Some(\"main\".to_string()));\n    }\n\n    #[test]\n    fn clean_plain_url_passes_through() {\n        let (url, branch) = clean_git_url(\"https://github.com/vercel-labs/skills\");\n        assert_eq!(url, \"https://github.com/vercel-labs/skills\");\n        assert_eq!(branch, None);\n    }\n\n    #[test]\n    fn clean_gitlab_tree_extracts_repo_and_branch() {\n        let (url, branch) = clean_git_url(\"https://gitlab.com/owner/repo/-/tree/main/src\");\n        assert_eq!(url, \"https://gitlab.com/owner/repo\");\n        assert_eq!(branch, Some(\"main\".to_string()));\n    }\n\n    #[test]\n    fn clean_file_url_passes_through() {\n        let (url, branch) = clean_git_url(\"file:///path/to/repo\");\n        assert_eq!(url, \"file:///path/to/repo\");\n        assert_eq!(branch, None);\n    }\n}\n","traces":[{"line":11,"address":[],"length":0,"stats":{"Line":39}},{"line":12,"address":[],"length":0,"stats":{"Line":78}},{"line":13,"address":[],"length":0,"stats":{"Line":76}},{"line":14,"address":[],"length":0,"stats":{"Line":72}},{"line":15,"address":[],"length":0,"stats":{"Line":70}},{"line":18,"address":[],"length":0,"stats":{"Line":6}},{"line":19,"address":[],"length":0,"stats":{"Line":12}},{"line":20,"address":[],"length":0,"stats":{"Line":24}},{"line":21,"address":[],"length":0,"stats":{"Line":18}},{"line":24,"address":[],"length":0,"stats":{"Line":11}},{"line":25,"address":[],"length":0,"stats":{"Line":22}},{"line":26,"address":[],"length":0,"stats":{"Line":22}},{"line":27,"address":[],"length":0,"stats":{"Line":0}},{"line":30,"address":[],"length":0,"stats":{"Line":55}},{"line":31,"address  = 2;\n\n#[derive(Debug, Serialize, Deserialize)]\npub struct Lockfile {\n    pub version: u8,\n    #[serde(rename = \"capabilities\")]\n    pub capabilities: BTreeMap\u003cString, CapabilityLockEntry\u003e,\n}\n\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct CapabilityLockEntry {\n    #[serde(rename = \"type\")]\n    pub capability_type: String,\n    #[serde(rename = \"installedVersion\")]\n    pub installed_version: String,\n    #[serde(rename = \"sourcePath\")]\n    pub source_path: String,\n    pub targets: BTreeMap\u003cString, TargetLockEntry\u003e,\n    #[serde(default, skip_serializing_if = \"Option::is_none\")]\n    pub source: Option\u003cSourceMetadata\u003e,\n    #[serde(default = \"default_scope\")]\n    pub scope: String,\n}\n\nfn default_scope() -\u003e String {\n    \"project\".to_string()\n}\n\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct SourceMetadata {\n    #[serde(rename = \"type\")]\n    pub source_type: String,\n    pub url: String,\n    #[serde(rename = \"ref\")]\n    pub source_ref: String,\n    pub skill: String,\n}\n\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct TargetLockEntry {\n    #[serde(rename = \"baselineDir\")]\n    pub baseline_dir: String,\n    #[serde(rename = \"emittedFiles\")]\n    pub emitted_files: Vec\u003cEmittedFile\u003e,\n}\n\npub fn lockfile_path(repo_root: \u0026Path) -\u003e PathBuf {\n    repo_root.join(\".coral\").join(\"coral-lock.json\")\n}\n\npub fn init_lockfile(repo_root: \u0026Path) -\u003e Result\u003cPathBuf\u003e {\n    let coral_dir = repo_root.join(\".coral\");\n    let lock_path = coral_dir.join(\"coral-lock.json\");\n    init_lockfile_at(\u0026lock_path)?;\n    Ok(lock_path)\n}\n\npub fn init_lockfile_at(lock_path: \u0026Path) -\u003e Result\u003c()\u003e {\n    if !lock_path.exists() {\n        write_lockfile_at(\n            lock_path,\n            \u0026Lockfile {\n                version: LOCKFILE_VERSION,\n                capabilities: BTreeMap::new(),\n \n    pub root: PathBuf,\n}\n\n#[derive(Debug, Clone, Deserialize)]\npub struct ImplementationConfig {\n    pub language: String,\n    pub entrypoint: String,\n    #[serde(default)]\n    pub runtime_deps: Vec\u003cString\u003e,\n}\n\n#[derive(Debug, Clone, Deserialize)]\npub struct HookConfig {\n    pub event: String,\n    pub command: String,\n    #[serde(default = \"default_cwd\")]\n    pub working_directory: String,\n}\n\nfn default_cwd() -\u003e String {\n    \".\".to_string()\n}\n\nimpl CapabilityManifest {\n    pub fn source_files(\u0026self) -\u003e Result\u003cVec\u003cPathBuf\u003e\u003e {\n        let mut paths = Vec::new();\n\n        for f in \u0026self.files {\n            let clean = f.trim_start_matches(\"./\");\n            let path = self.root.join(clean);\n            if !path.exists() {\n                return Err(CoralError::new(format!(\n                    \"capability source file not found: {}\",\n                    path.display()\n                )));\n            }\n            paths.push(path);\n        }\n\n        if self.capability_type == \"tool\" {\n            if let Some(ref imp) = self.implementation {\n                let ep_path = self.root.join(\u0026imp.entrypoint);\n                if !paths.contains(\u0026ep_path) \u0026\u0026 ep_path.exists() {\n                    paths.push(ep_path);\n                }\n            }\n        }\n\n        Ok(paths)\n    }\n\n    pub fn read_source_contents_with_names(\u0026self) -\u003e Result\u003cVec\u003c(String, Vec\u003cu8\u003e)\u003e\u003e {\n        self.source_files()?\n            .iter()\n            .map(|p| {\n                let rel = p\n                    .strip_prefix(\u0026self.root)\n                    .unwrap_or(p)\n                    .to_string_lossy()\n                    .replace('\\\\', \"/\");\n                let rel = rel.strip_prefix(\"src/\").unwrap_or(\u0026rel).to_string();\n                let content = std::fs::read(p)?;\n                Ok((rel, content))\n            })\n            .collect()\n    }\n}\n\nfn validate_non_empty(field: \u0026str, value: \u0026str) -\u003e Result\u003c()\u003e {\n    if value.is_empty() {\n        return Err(CoralError::new(format!(\n            \"capability manifest field '{field}' must be a non-empty string\"\n        )));\n    }\n    Ok(())\n}\n\npub fn load_manifest(capability_dir: \u0026Path) -\u003e Result\u003cCapabilityManifest\u003e {\n    let manifest_path = capability_dir.join(\"coral.toml\");\n    if !manifest_path.exists() {\n        return Err(CoralError::new(format!(\n            \"capability manifest not found: {}\",\n            manifest_path.display()\n        )));\n    }\n\n    let mut manifest: CapabilityManifest =\n        toml::from_str(\u0026std::fs::read_to_string(\u0026manifest_path)?)?;\n    manifest.root = capability_dir.to_path_buf();\n\n    validate_non_empty(\"id\", \u0026manifest.id)?;\n    validate_non_empty(\"version\", \u0026manifest.version)?;\n    validate_non_empty(\"type\", \u0026manifest.capability_type)?;\n    validate_non_empty(\"description\", \u0026manifest.description)?;\n\n    match manifest.capability_type.as_str() {\n        \"skill\" =\u003e {\n            if manifest.files.is_empty() {\n                return Err(CoralError::new(\"skill capability 'files' must not be empty\"));\n            }\n            manifest.source_files()?;\n        }\n        \"tool\" =\u003e {\n            if manifest.parameters.is_none() {\n                return Err(CoralError::new(\n                    \"tool capability requires a [parameters] section with JSON Schema\",\n                ));\n            }\n            if manifest.implementation.is_none() {\n                return Err(CoralError::new(\n                    \"tool capability requires an [implementation] section\",\n                ));\n            }\n\n            let params = manifest.parameters.as_ref().unwrap();\n            crate::tool::validate_json_schema(params)?;\n\n            let impl_cfg = manifest.implementation.as_ref().unwrap();\n            crate::tool::validate_entrypoint(\u0026manifest.root, \u0026impl_cfg.entrypoint)?;\n\n            if !impl_cfg.runtime_deps.is_empty() {\n                eprintln!(\n                    \"note: this tool requires runtime dependencies: {}\",\n                    impl_cfg.runtime_deps.join(\", \")\n                );\n            }\n\n            if !manifest.files.is_empty() {\n                manifest.source_files()?;\n            }\n        }\n        \"hook\" =\u003e {\n            let hook_cfg = manifest.hook.as_ref().ok_or_else(|| {\n                CoralError::new(\"hook capability requires a [hook] section\")\n            })?;\n\n            if hook_cfg.event.trim().is_empty() {\n                return Err(CoralError::new(\"hook 'event' must be a non-empty string\"));\n            }\n            if hook_cfg.command.trim().is_empty() {\n                return Err(CoralError::new(\"hook 'command' must be a non-empty string\"));\n            }\n\n            crate::tool::check_path_traversal(\u0026hook_cfg.working_directory)?;\n\n            eprintln!(\n                \"note: this hook runs '{}' on event '{}' — it will not be executed during install\",\n                hook_cfg.command, hook_cfg.event\n            );\n\n            if !manifest.files.is_empty() {\n                manifest.source_files()?;\n            }\n        }\n        other =\u003e {\n            return Err(CoralError::new(format!(\n                \"unsupported capability type '{}'; supported: skill, tool, hook\",\n                other\n            )));\n        }\n    }\n\n    Ok(manifest)\n}\n\npub fn synthetic_manifest(skill_dir: \u0026Path, name: \u0026str, version: \u0026str) -\u003e Result\u003cCapabilityManifest\u003e {\n    let mut files = Vec::new();\n    walk_skill_dir(skill_dir, \"\", \u0026mut files)?;\n\n    Ok(CapabilityManifest {\n        id: name.to_string(),\n        version: version.to_string(),\n        capability_type: \"skill\".to_string(),\n        description: String::new(),\n        files,\n        parameters: None,\n        implementation: None,\n        hook: None,\n        targets: Vec::new(),\n        root: skill_dir.to_path_buf(),\n    })\n}\n\nfn walk_skill_dir(base: \u0026Path, prefix: \u0026str, files: \u0026mut Vec\u003cString\u003e) -\u003e Result\u003c()\u003e {\n    for entry in std::fs::read_dir(base)? {\n        let entry = entry?;\n        let path = entry.path();\n        let rel = if prefix.is_empty() {\n            entry.file_name().to_string_lossy().to_string()\n        } else {\n            format!(\"{}/{}\", prefix, entry.file_name().to_string_lossy())\n        };\n        if path.is_dir() {\n            walk_skill_dir(\u0026path, \u0026rel, files)?;\n        } else {\n            files.push(rel);\n        }\n    }\n    Ok(())\n}\n","traces":[{"line":46,"address":[],"length":0,"stats":{"Line":2}},{"line":47,"address":[],"length":0,"stats":{"Line":4}},{"line":51,"address":[],"length":0,"stats":{"Line":46}},{"line":52,"address":[],"length":0,"stats":{"Line":92}},{"line":54,"address":[],"length":0,"stats":{"Line":88}},{"line":55,"address":[],"length":0,"stats":{"Line":84}},{"line":56,"address":[],"length":0,"stats":{"Line":126}},{"line":57,"address":[],"length":0,"stats":{"Line":42}},{"line":58,"address":[],"length":0,"stats":{"Line":0}},{"line":59,"address":[],"length":0,"stats":{"Line":0}},{"line":60,"address":[],"length":0,"stats":{"Line":0}},{"line":63,"address":[],"length":0,"stats":{"Line":126}},{"line":66,"address":[],"length":0,"stats":{"Line":46}},{"line":67,"address":[],"length":0,"stats":{"Line":20}},{"line":68,"address":[],"length":0,"stats":{"Line":30}},{"line":69,"address":[],"length":0,"stats":{"Line":20}},{"line":70,"address":[],"length":0,"stats":{"Line":0}},{"line":75,"address":[],"length":0,"stats":{"Line":46}},{"line":78,"address":[],"length":0,"stats":{"Line":27}},{"line":79,"address":[],"length":0,"stats":{"Line":54}},{"l     <script>const e = React.createElement;

function pathToString(path) {
  if (path[0] === '/') {
    return '/' + path.slice(1).join('/');
  } else {
    return path.join('/');
  }
}

function findCommonPath(files) {
  if (!files || !files.length) {
    return [];
  }

  function isPrefix(arr, prefix) {
    if (arr.length < prefix.length) {
      return false;
    }
    for (let i = prefix.length - 1; i >= 0; --i) {
      if (arr[i] !== prefix[i]) {
        return false;
      }
    }
    return true;
  }

  let commonPath = files[0].path.slice(0, -1);
  while (commonPath.length) {
    if (files.every(file => isPrefix(file.path, commonPath))) {
      break;
    }
    commonPath.pop();
  }
  return commonPath;
}

function findFolders(files) {
  if (!files || !files.length) {
    return [];
  }

  let folders = files.filter(file => file.path.length > 1).map(file => file.path[0]);
  folders = [...new Set(folders)]; // unique
  folders.sort();

  folders = folders.map(folder => {
    let filesInFolder = files
      .filter(file => file.path[0] === folder)
      .map(file => ({
        ...file,
        path: file.path.slice(1),
        parent: [...file.parent, file.path[0]],
      }));

    const children = findFolders(filesInFolder); // recursion

    return {
      is_folder: true,
      path: [folder],
      parent: files[0].parent,
      children,
      covered: children.reduce((sum, file) => sum + file.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.coverable, 0),
      prevRun: {
        covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
        coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
      },
    };
  });

  return [...folders, ...files.filter(file => file.path.length === 1)];
}

class App extends React.Component {
  constructor(...args) {
    super(...args);

    this.state = {
      current: [],
    };
  }

  componentDidMount() {
    this.updateStateFromLocation();
    window.addEventListener('hashchange', () => this.updateStateFromLocation(), false);
  }

  updateStateFromLocation() {
    if (window.location.hash.length > 1) {
      const current = window.location.hash.slice(1).split('/').map(decodeURIComponent);
      this.setState({current});
    } else {
      this.setState({current: []});
    }
  }

  getCurrentPath() {
    let file = this.props.root;
    let path = [file];
    for (let p of this.state.current) {
      file = file.children.find(file => file.path[0] === p);
      if (!file) {
        return path;
      }
      path.push(file);
    }
    return path;
  }

  render() {
    const path = this.getCurrentPath();
    const file = path[path.length - 1];

    let w = null;
    if (file.is_folder) {
      w = e(FilesList, {
        folder: file,
        onSelectFile: this.selectFile.bind(this),
        onBack: path.length > 1 ? this.back.bind(this) : null,
      });
    } else {
      w = e(DisplayFile, {
        file,
        onBack: this.back.bind(this),
      });
    }

    return e('div', {className: 'app'}, w);
  }

  selectFile(file) {
    this.setState(
      ({current}) => {
        return {current: [...current, file.path[0]]};
      },
      () => this.updateHash(),
    );
  }

  back(file) {
    this.setState(
      ({current}) => {
        return {current: current.slice(0, current.length - 1)};
      },
      () => this.updateHash(),
    );
  }

  updateHash() {
    if (!this.state.current || !this.state.current.length) {
      window.location = '#';
    } else {
      window.location = '#' + this.state.current.join('/');
    }
  }
}

function FilesList({folder, onSelectFile, onBack}) {
  let files = folder.children;
  return e(
    'div',
    {className: 'display-folder'},
    e(FileHeader, {file: folder, onBack}),
    e(
      'table',
      {className: 'files-list'},
      e('thead', {className: 'files-list__head'}, e('tr', null, e('th', null, 'Path'), e('th', null, 'Coverage'))),
      e(
        'tbody',
        {className: 'files-list__body'},
        files.map(file => e(File, {file, onClick: onSelectFile})),
      ),
    ),
  );
}

function File({file, onClick}) {
  const coverage = file.coverable ? (file.covered / file.coverable) * 100 : -1;
  const coverageDelta =
    file.prevRun && (file.covered / file.coverable) * 100 - (file.prevRun.covered / file.prevRun.coverable) * 100;

  return e(
    'tr',
    {
      className:
        'files-list__file' +
        (coverage >= 0 && coverage < 50 ? ' files-list__file_low' : '') +
        (coverage >= 50 && coverage < 80 ? ' files-list__file_medium' : '') +
        (coverage >= 80 ? ' files-list__file_high' : '') +
        (file.is_folder ? ' files-list__file_folder' : ''),
      onClick: () => onClick(file),
    },
    e('td', null, e('a', null, pathToString(file.path))),
    e(
      'td',
      null,
      file.covered + ' / ' + file.coverable + (coverage >= 0 ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e(
        'span',
        {title: 'Change from the previous run'},
        coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : '',
      ),
    ),
  );
}

function DisplayFile({file, onBack}) {
  return e('div', {className: 'display-file'}, e(FileHeader, {file, onBack}), e(FileContent, {file}));
}

function FileHeader({file, onBack}) {
  const coverage = (file.covered / file.coverable) * 100;
  const coverageDelta = file.prevRun && coverage - (file.prevRun.covered / file.prevRun.coverable) * 100;

  return e(
    'div',
    {className: 'file-header'},
    onBack ? e('a', {className: 'file-header__back', onClick: onBack}, 'Back') : null,
    e('div', {className: 'file-header__name'}, pathToString([...file.parent, ...file.path])),
    e(
      'div',
      {className: 'file-header__stat'},
      'Covered: ' + file.covered + ' of ' + file.coverable + (file.coverable ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e(
        'span',
        {title: 'Change from the previous run'},
        coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : '',
      ),
      e('input', {id: 'theme-toggle', type: 'checkbox', hidden: true}),
      e('label', {for: 'theme-toggle', id: 'theme-toggle-label'}, '🌙'),
    ),
  );
}

function FileContent({file}) {
  return e(
    'pre',
    {className: 'file-content'},
    file.content.split(/\r?\n/).map((line, index) => {
      const trace = file.traces.find(trace => trace.line === index + 1);
      const covered = trace && trace.stats.Line;
      const uncovered = trace && !trace.stats.Line;
      const nbHit = covered? trace.stats.Line: 0;
      return e(
        'div',
        { className: 'code-text-container' },
        e(
          'code',
          {
            className: 'code-line' + (covered ? ' code-line_covered' : '') + (uncovered ? ' code-line_uncovered' : ''),
          },
          line
        ),
        e(
          'div',
          { className: 'cover-indicator' + (covered? ' check-cover': '') + (uncovered? ' no-cover': '')},
          e(
            'div',
            { className: (covered? 'stat-line-hit': '')},
            covered? nbHit: ""
          )
        )
      );
    }),
  );
}

(function () {
  const commonPath = findCommonPath(data.files);
  const prevFilesMap = new Map();

  previousData &&
    previousData.files.forEach(file => {
      const path = file.path.slice(commonPath.length).join('/');
      prevFilesMap.set(path, file);
    });

  const files = data.files.map(file => {
    const path = file.path.slice(commonPath.length);
    const {covered = 0, coverable = 0} = prevFilesMap.get(path.join('/')) || {};
    return {
      ...file,
      path,
      parent: commonPath,
      prevRun: {covered, coverable},
    };
  });

  const children = findFolders(files);

  const root = {
    is_folder: true,
    children,
    path: commonPath,
    parent: [],
    covered: children.reduce((sum, file) => sum + file.covered, 0),
    coverable: children.reduce((sum, file) => sum + file.coverable, 0),
    prevRun: {
      covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
    },
  };

  if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }

  ReactDOM.render(e(App, {root, prevFilesMap}), document.getElementById('root'));

  const toggle = document.getElementById('theme-toggle');
  const label = document.getElementById('theme-toggle-label');
  label.textContent = '🌙';

  toggle.addEventListener('change', () => {
    if (toggle.checked) {
      document.documentElement.setAttribute('data-theme', 'dark');
      label.textContent = '☀️';
    } else {
      document.documentElement.removeAttribute('data-theme');
      label.textContent = '🌙';
    }
  });
})();
</script>
