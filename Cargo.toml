[workspace]
members = [
    "crates/tuff-cli",
    "crates/tuff-core",
    "crates/tuff-hooks-spec",
    "crates/tuff-adapter-open-agents",
    "crates/tuff-adapter-claude",
    "crates/tuff-adapter-codex",
    "crates/tuff-adapter-cursor",
    "crates/tuff-adapter-opencode",
]
resolver = "2"

# Every workspace crate publishes in lockstep: bump this version, then run
# `cargo update -w` to refresh the lockfile, then tag. release.yml publishes
# all eight crates to crates.io in dependency order on every `v*` tag.
[workspace.package]
version = "0.10.2"
edition = "2024"
license = "MIT"
authors = ["Kannan Kalidasan"]
homepage = "https://tuffcli.dev"
documentation = "https://tuffcli.dev"
repository = "https://github.com/kannandreams/tuff"

[workspace.dependencies]
tuff-hooks-spec = { path = "crates/tuff-hooks-spec", version = "0.10.2" }
tuff-core = { path = "crates/tuff-core", version = "0.10.2" }
tuff-adapter-open-agents = { path = "crates/tuff-adapter-open-agents", version = "0.10.2" }
tuff-adapter-claude = { path = "crates/tuff-adapter-claude", version = "0.10.2" }
tuff-adapter-codex = { path = "crates/tuff-adapter-codex", version = "0.10.2" }
tuff-adapter-cursor = { path = "crates/tuff-adapter-cursor", version = "0.10.2" }
tuff-adapter-opencode = { path = "crates/tuff-adapter-opencode", version = "0.10.2" }
