[package]
name = "coral"
version = "0.1.0"
edition = "2024"
description = "Capability lifecycle manager for coding agents."
license = "MIT"

[[bin]]
name = "coral"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
git2 = { version = "0.20", features = ["vendored-libgit2"] }
tempfile = "3.23.0"
tabled = "0.18"
toml = "0.9.8"
url = "2.5.6"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
