[package]
name = "tuff-core"
version.workspace = true
edition.workspace = true
description = "Core lifecycle engine and adapter contract for Tuff."
license.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true

[dependencies]
tuff-hooks-spec.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
git2 = { version = "0.20", features = ["vendored-libgit2", "vendored-openssl"] }
tempfile = "3.23.0"
toml = "0.9.8"
url = "2.5.6"
docker_credential = "1.4.0"
oci-client = { version = "0.17.0", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1.47.1", features = ["fs", "io-util"] }
