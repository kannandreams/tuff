[package]
name = "tuff-core"
version.workspace = true
edition.workspace = true
description = "Core lifecycle engine and adapter contract for Tuff."
license.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true

[features]
default = ["registry", "diff"]
# Pulling and pushing packs in OCI registries, and the MCP registry client:
# the `oci` and `registry` modules.
registry = ["dep:reqwest", "dep:oci-client", "dep:tokio", "dep:docker_credential"]
# Line-by-line patches in `tree_diff`, and the `report` module, through
# libgit2. Without it, `tree_diff` still lists changed files.
diff = ["dep:git2"]

[dependencies]
tuff-hooks-spec.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# Order-preserving JSON objects for harness config files whose rule order is
# precedence (OpenCode), without turning on serde_json's preserve_order for
# the whole workspace.
indexmap = { version = "2", features = ["serde"] }
sha2 = "0.10.9"
# Local trees and repositories only, so without its network features (and
# the OpenSSL and libssh2 they build).
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"], optional = true }
semver = "1.0.27"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tempfile = "3.23.0"
toml = "0.9.8"
# Format-preserving edits to a harness TOML config a user also hand-edits
# (Codex's .codex/config.toml).
toml_edit = "0.25"
url = "2.5.6"
docker_credential = { version = "1.4.0", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "http2"], optional = true }
oci-client = { version = "0.17.0", default-features = false, features = ["rustls-tls"], optional = true }
tokio = { version = "1.47.1", features = ["fs", "io-util"], optional = true }
