[package]
name = "tuff-console"
version.workspace = true
edition.workspace = true
description = "Console server for Tuff: stores project reports in SQLite and serves them over HTTP."
license.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true

[dependencies]
tuff-core.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1.47.1", features = ["rt-multi-thread", "net", "signal", "macros"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "http2", "json"] }
# Already in the tree through oci-client, with the same aws-lc-rs backend as rustls.
jsonwebtoken = { version = "10.4", default-features = false, features = ["aws_lc_rs"] }

[dev-dependencies]
aws-lc-rs = "1"
base64 = "0.22"
tempfile = "3.23.0"
