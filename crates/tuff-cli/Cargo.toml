[package]
name = "tuffcli"
version = "0.1.5"
edition = "2024"
description = "Capability lifecycle manager for coding agents."
license = "MIT"
authors = ["Kannan Kalidasan"]
homepage = "https://tuffcli.dev"
documentation = "https://tuffcli.dev"
repository = "https://github.com/kannandreams/tuff"

[[bin]]
name = "tuff"
path = "src/main.rs"

[dependencies]
tuff-core = { path = "../tuff-core", version = "0.1.0" }
tuff-hooks-spec = { path = "../tuff-hooks-spec", version = "0.1.0" }
tuff-adapter-open-agents = { path = "../tuff-adapter-open-agents", version = "0.1.0" }
tuff-adapter-claude = { path = "../tuff-adapter-claude", version = "0.1.0" }
tuff-adapter-codex = { path = "../tuff-adapter-codex", version = "0.1.0" }
tuff-adapter-cursor = { path = "../tuff-adapter-cursor", version = "0.1.0" }
clap = { version = "4.5.53", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
tokio = { version = "1.47.1", features = ["rt", "time"] }

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
