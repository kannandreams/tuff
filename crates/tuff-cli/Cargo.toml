[package]
name = "tuffcli"
version.workspace = true
edition.workspace = true
description = "Capability lifecycle manager for coding agents."
license.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true

[[bin]]
name = "tuff"
path = "src/main.rs"

[dependencies]
tuff-core.workspace = true
tuff-hooks-spec.workspace = true
tuff-adapter-open-agents.workspace = true
tuff-adapter-claude.workspace = true
tuff-adapter-codex.workspace = true
tuff-adapter-cursor.workspace = true
clap = { version = "4.5.53", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
tokio = { version = "1.47.1", features = ["rt", "time"] }
semver = "1.0.27"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
