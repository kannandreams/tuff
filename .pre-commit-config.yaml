default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: branch-name
        name: Validate branch name
        entry: scripts/check-branch-name.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false

      - id: commit-message
        name: Validate commit message (Conventional Commits)
        entry: scripts/check-commit-message.sh
        language: system
        stages: [commit-msg]
