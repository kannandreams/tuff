default_install_hook_types: [pre-commit, commit-msg]

repos:
  # Generic secret detection. GitHub's free secret scanning covers known
  # provider formats only; non-provider patterns and validity checks need
  # Secret Protection on a paid plan. This catches the generic cases locally,
  # before a commit exists. --redact means a hit is reported without echoing
  # the secret into the terminal or a CI log.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: branch-name
        name: Validate branch name
        entry: scripts/check-branch-name.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false

      - id: plugin-manifests
        name: Validate Claude Code plugin manifests
        entry: scripts/check-plugin.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false
        files: '^(crates/tuff-cli/assets/tuff-cli-guide\.md|plugins/tuff/.*|\.claude-plugin/.*)$'

      - id: commit-message
        name: Validate commit message (Conventional Commits)
        entry: scripts/check-commit-message.sh
        language: system
        stages: [commit-msg]
