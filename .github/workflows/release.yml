name: Release

# To trigger a new release:
#   git tag v0.1.0 && git push origin v0.1.0
#
# To re-tag after fixing the workflow:
#   git tag -d v0.1.0
#   git push origin :refs/tags/v0.1.0
#   git tag v0.1.0
#   git push origin v0.1.0
#
# After the release succeeds, copy the printed formula to:
#   github.com/kannandreams/homebrew-coral → Formula/coral.rb

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: coral-x86_64-apple-darwin.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: coral-aarch64-apple-darwin.tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: coral-x86_64-unknown-linux-gnu.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }} coral

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            x86_64-apple-darwin/coral-x86_64-apple-darwin.tar.gz
            aarch64-apple-darwin/coral-aarch64-apple-darwin.tar.gz
            x86_64-unknown-linux-gnu/coral-x86_64-unknown-linux-gnu.tar.gz

      - name: Generate Homebrew formula
        run: |
          SHA_ARM=$(shasum -a 256 aarch64-apple-darwin/coral-aarch64-apple-darwin.tar.gz | awk '{print $1}')
          SHA_INTEL=$(shasum -a 256 x86_64-apple-darwin/coral-x86_64-apple-darwin.tar.gz | awk '{print $1}')
          SHA_LINUX=$(shasum -a 256 x86_64-unknown-linux-gnu/coral-x86_64-unknown-linux-gnu.tar.gz | awk '{print $1}')
          TAG="${GITHUB_REF#refs/tags/}"

          cat << EOF > formula.rb
          class Coral < Formula
            desc "Capability lifecycle manager for coding agents"
            homepage "https://github.com/kannandreams/coral"
            license "MIT"
            version "${TAG#v}"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/kannandreams/coral/releases/download/${TAG}/coral-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_ARM}"
              else
                url "https://github.com/kannandreams/coral/releases/download/${TAG}/coral-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_INTEL}"
              end
            end

            on_linux do
              url "https://github.com/kannandreams/coral/releases/download/${TAG}/coral-x86_64-unknown-linux-gnu.tar.gz"
              sha256 "${SHA_LINUX}"
            end

            def install
              bin.install "coral"
            end

            test do
              system "#{bin}/coral", "--version"
            end
          end
          EOF

          echo "::notice::Homebrew formula — copy this to homebrew-coral/Formula/coral.rb"
          cat formula.rb
