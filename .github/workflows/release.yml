name: Release

# To trigger a new release:
#   git tag v0.1.0 && git push origin v0.1.0
#
# To re-tag after fixing the workflow:
#   git tag -d v0.1.0
#   git push origin :refs/tags/v0.1.0
#   git tag v0.1.0
#   git push origin v0.1.0
#
# After the release succeeds, copy the printed formula to:
#   github.com/kannandreams/homebrew-tuff → Formula/tuff.rb

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      MISE_LOCKED: "1"
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: tuff-x86_64-apple-darwin.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: tuff-aarch64-apple-darwin.tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: tuff-x86_64-unknown-linux-gnu.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: jdx/mise-action@v4.2.3
        with:
          version: 2026.8.2
          install_args: rust
          cache: true

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --locked -p tuffcli --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }} tuff

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Generate checksums
        run: |
          {
            sha256sum aarch64-apple-darwin/tuff-aarch64-apple-darwin.tar.gz | awk '{print $1 "  tuff-aarch64-apple-darwin.tar.gz"}'
            sha256sum x86_64-apple-darwin/tuff-x86_64-apple-darwin.tar.gz | awk '{print $1 "  tuff-x86_64-apple-darwin.tar.gz"}'
            sha256sum x86_64-unknown-linux-gnu/tuff-x86_64-unknown-linux-gnu.tar.gz | awk '{print $1 "  tuff-x86_64-unknown-linux-gnu.tar.gz"}'
          } > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            x86_64-apple-darwin/tuff-x86_64-apple-darwin.tar.gz
            aarch64-apple-darwin/tuff-aarch64-apple-darwin.tar.gz
            x86_64-unknown-linux-gnu/tuff-x86_64-unknown-linux-gnu.tar.gz
            checksums.txt

      - name: Generate Homebrew formula
        run: |
          SHA_ARM=$(awk '$2 == "tuff-aarch64-apple-darwin.tar.gz" {print $1}' checksums.txt)
          SHA_INTEL=$(awk '$2 == "tuff-x86_64-apple-darwin.tar.gz" {print $1}' checksums.txt)
          SHA_LINUX=$(awk '$2 == "tuff-x86_64-unknown-linux-gnu.tar.gz" {print $1}' checksums.txt)
          TAG="${GITHUB_REF#refs/tags/}"

          cat << EOF > formula.rb
          class Tuff < Formula
            desc "Capability lifecycle manager for coding agents"
            homepage "https://github.com/kannandreams/tuff"
            license "MIT"
            version "${TAG#v}"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/kannandreams/tuff/releases/download/${TAG}/tuff-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_ARM}"
              else
                url "https://github.com/kannandreams/tuff/releases/download/${TAG}/tuff-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_INTEL}"
              end
            end

            on_linux do
              url "https://github.com/kannandreams/tuff/releases/download/${TAG}/tuff-x86_64-unknown-linux-gnu.tar.gz"
              sha256 "${SHA_LINUX}"
            end

            def install
              bin.install "tuff"
            end

            test do
              system "#{bin}/tuff", "--version"
            end
          end
          EOF

          echo "::notice::Homebrew formula — copy this to homebrew-tuff/Formula/tuff.rb"
          cat formula.rb
