name: Coral Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Build coral
        run: cargo build --release

      - name: Run tests
        run: cargo test

      - name: Validate capabilities
        run: cargo run -- check --json
