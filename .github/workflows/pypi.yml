name: Publish Python wheels

on:
  push:
    tags:
      - 'v*'

jobs:
  wheels:
    name: Build wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux wheels build in a manylinux_2_28 container, so they install on glibc 2.28 and later.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: '2_28'
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Build wheel
        uses: PyO3/maturin-action@v1.51.0
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          rust-toolchain: 1.97.1
          args: --locked --release --manifest-path crates/tuff-cli/Cargo.toml --bindings bin --out dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: tuffcli-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

      # The Python SDK: one abi3 wheel per platform for Python 3.9 and later.
      - name: Build tuff-sdk wheel
        uses: PyO3/maturin-action@v1.51.0
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          rust-toolchain: 1.97.1
          args: --locked --release --manifest-path crates/tuff-python/Cargo.toml --out sdk-dist

      - name: Upload tuff-sdk wheel
        uses: actions/upload-artifact@v4
        with:
          name: tuff-sdk-wheel-${{ matrix.target }}
          path: sdk-dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish wheels to PyPI
    needs: wheels
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/tuffcli

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: tuffcli-wheel-*
          path: dist
          merge-multiple: true

      - name: Check distributions
        run: pipx run twine check dist/*

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-sdk:
    name: Publish tuff-sdk wheels to PyPI
    needs: wheels
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    environment:
      name: pypi-tuff-sdk
      url: https://pypi.org/p/tuff-sdk

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: tuff-sdk-wheel-*
          path: dist
          merge-multiple: true

      - name: Check distributions
        run: pipx run twine check dist/*

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
