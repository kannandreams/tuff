name: Tuff Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      MISE_LOCKED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install development toolchain
        uses: jdx/mise-action@v4.2.3
        with:
          version: 2026.8.2
          cache: true

      # mise-action's cache covers mise's own tool installs, not cargo. Without
      # this the workspace recompiles every dependency from scratch on every
      # run, in both the dev and release profiles, which is roughly 7 of the 8
      # minutes this job takes. Must run after mise installs the toolchain: the
      # cache key includes the rustc version.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.2

      - name: Run repository checks
        run: mise run check

      - name: Run OCI registry integration test
        env:
          TUFF_OCI_TEST_REGISTRY: localhost:5000
        run: cargo test -p tuffcli --test oci_registry -- --ignored
