name: Tuff Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      MISE_LOCKED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install development toolchain
        uses: jdx/mise-action@v4.2.3
        with:
          version: 2026.8.2
          cache: true

      - name: Run repository checks
        run: mise run check
